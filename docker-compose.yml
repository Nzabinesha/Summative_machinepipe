services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - AUTO_RETRAIN=false
      - RETRAIN_THRESHOLD=50
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - API_URL=http://nginx
    ports:
      - "8501:8501"
    depends_on:
      - nginx
      